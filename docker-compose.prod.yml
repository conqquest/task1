services:
  db:
    image: postgres:16-alpine
    container_name: joineazy-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: joineazy
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d joineazy"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: 129462560412.dkr.ecr.ap-south-1.amazonaws.com/joineazy-backend:latest
    container_name: joineazy-backend
    restart: unless-stopped
    ports:
      - "5001:5000"
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/joineazy
      JWT_SECRET: super-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: 129462560412.dkr.ecr.ap-south-1.amazonaws.com/joineazy-frontend:latest
    container_name: joineazy-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
